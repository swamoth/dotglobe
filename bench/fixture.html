<!doctype html>
<meta charset="utf-8">
<title>dotglobe benchmark</title>
<style>html,body{margin:0;height:100%;background:#000}canvas{display:block;width:100%;height:100%}</style>
<canvas id="c"></canvas>
<script type="module">
/*
 * The page under measurement. It reports one result object on window.__bench.
 * The runner reads that object. Nothing is printed here.
 */
const params = new URLSearchParams(location.search);
const markers = Number(params.get('markers') ?? 0);
const arcs = Number(params.get('arcs') ?? 0);
const frames = Number(params.get('frames') ?? 240);

const done = (value) => { window.__bench = value; };

let mod;
try {
  mod = await import('../dist/dotglobe.js');
} catch (e) {
  done({ skipped: 'the bundle failed to load: ' + e.message });
  throw e;
}

if (typeof mod.createGlobe !== 'function') {
  done({ skipped: 'createGlobe is not exported yet' });
} else {
  const canvas = document.getElementById('c');
  const dpr = 2;
  canvas.width = Math.round(canvas.clientWidth * dpr);
  canvas.height = Math.round(canvas.clientHeight * dpr);

  const start = performance.now();
  const globe = mod.createGlobe(canvas, {
    devicePixelRatio: dpr,
    markers: Array.from({ length: markers }, (_, i) => ({
      lat: (i * 73) % 180 - 90, lng: (i * 131) % 360 - 180, size: 0.01,
    })),
    arcs: Array.from({ length: arcs }, (_, i) => ({
      startLat: (i * 37) % 180 - 90, startLng: (i * 91) % 360 - 180,
      endLat: (i * 53) % 180 - 90, endLng: (i * 17) % 360 - 180,
    })),
  });

  globe.render();
  const firstFrameMs = performance.now() - start;

  // GPU time, when the extension is there. A CPU timer cannot see the GPU.
  const gl = globe.gl;
  const ext = gl && gl.getExtension('EXT_disjoint_timer_query_webgl2');

  const cpu = [], gpu = [];
  for (let i = 0; i < frames; i++) {
    globe.rotate(i * 0.01);
    const query = ext ? gl.createQuery() : null;
    if (query) gl.beginQuery(ext.TIME_ELAPSED_EXT, query);
    const t0 = performance.now();
    globe.render();
    cpu.push(performance.now() - t0);
    if (query) { gl.endQuery(ext.TIME_ELAPSED_EXT); gpu.push(query); }
    await new Promise(requestAnimationFrame);
  }

  let gpuMs = [];
  if (ext) {
    await new Promise((r) => setTimeout(r, 200));
    for (const q of gpu) {
      if (gl.getQueryParameter(q, gl.QUERY_RESULT_AVAILABLE)) gpuMs.push(gl.getQueryParameter(q, gl.QUERY_RESULT) / 1e6);
      gl.deleteQuery(q);
    }
  }

  // Idle: with no input and no animation, the globe must schedule no frame at all.
  let idleFrames = 0;
  const count = () => { idleFrames++; };
  globe.onRender?.(count);
  await new Promise((r) => setTimeout(r, 1000));
  globe.offRender?.(count);

  done({ firstFrameMs, cpu, gpu: gpuMs, idleFrames, markers, arcs });
  globe.destroy?.();
}
</script>
